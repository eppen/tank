name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

  selftests:
    name: 自测（${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run selftests
        # run_selftests.py 内部以子进程逐个跑 _selftest*.py / _preview.py / _sim_coach.py，
        # 并自动注入 SDL_VIDEODRIVER=dummy / SDL_AUDIODRIVER=dummy（无显示器环境必需）。
        # 跨三平台是为了覆盖 tank_paths.py 的 LOCALAPPDATA / ~/.local/share 分支
        # 与 tank_game.py 的三平台字体候选路径。
        run: python run_selftests.py
